0077",
    tiktok: "M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 1.4-.54 2.79-1.35 3.94-1.31 1.92-3.58 3.17-5.91 3.21-1.43.08-2.86-.31-4.08-1.03-2.02-1.19-3.44-3.37-3.65-5.71-.02-.5-.03-1-.01-1.49.18-1.9 1.12-3.72 2.58-4.96 1.66-1.44 3.98-2.13 6.15-1.72.02 1.48-.04 2.96-.04 4.44-.99-.32-2.15-.23-3.02.37-.63.41-1.11 1.04-1.36 1.75-.21.51-.15 1.07-.14 1.61.24 1.64 1.82 3.02 3.5 2.87 1.12-.01 2.19-.66 2.77-1.61.19-.33.4-.67.41-1.06.1-1.79.06-3.57.07-5.36.01-4.03-.01-8.05.02-12.07z",
    youtube: "M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z",
    x: "M14.234 10.162 22.977 0h-2.072l-7.591 8.824L7.251 0H.258l9.168 13.343L.258 24H2.33l8.016-9.318L16.749 24h6.993zm-2.837 3.299-.929-1.329L3.076 1.56h3.182l5.965 8.532.929 1.329 7.754 11.09h-3.182z",
  };
  const socialKey = (p) => ({ twitter: "x", "x (twitter)": "x" })[p.trim().toLowerCase()] ?? p.trim().toLowerCase();

  const RENDER = {
    hero(s) {
      const facts = (s.facts ?? []).map((f, i) => `<div class="fact enter" style="${stagger(i, 400)}"><dt>${txt(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join("");
      return `<div class="slide hero"><span class="backdrop" aria-hidden="true">${aurora(HERO_BLOBS)}${sequence()}</span>` +
        `<div class="hero-shade" aria-hidden="true"></div>${helixArt("hero-helix")}` +
        `<div class="hero-inner">${s.eyebrow ? `<p class="pill"><span class="dot" aria-hidden="true"></span>${txt(s.eyebrow)}</p>` : ""}` +
        `<h1 class="hero-title">${txt(s.title)}</h1>${s.intro ? `<p class="hero-lede no-visual">${txt(s.intro)}</p>` : ""}` +
        `${facts ? `<dl class="facts">${facts}</dl>` : ""}</div><div class="rainbow" aria-hidden="true"></div></div>`;
    },

    concept(s, i) {
      const points = s.circles.map((c, k) => `<li class="enter" style="border-color:${ink(c)};${stagger(k, 320)}"><strong style="color:${ink(c)}">${esc(c.name)}</strong> ${txt(c.text)}</li>`).join("");
      return light(i, s,
        `<div class="concept for-words"><div>${eyebrow(i, s.eyebrow)}${heading(s.title)}` +
        `${s.definition ? `<p class="lede-xl enter" style="${d(160)}">${txt(s.definition)}</p>` : ""}<ul class="points">${points}</ul></div>${venn(s, true, "venn")}</div>` +
        `<div class="for-visual">${eyebrow(i, s.eyebrow)}${heading(s.title)}${equation(s)}</div>`,
        { motif: "glyphs" });
    },

    stepper(s, i) {
      const n = s.steps.length;
      const scenes = s.steps.map((st, k) => `<div class="stage-scene"${k ? " hidden" : ""}>${stepArt(st)}</div>`).join("");
      const panes = s.steps.map((st, k) =>
        `<div class="pane${k ? " is-off" : ""}"><p class="kicker enter">Step ${k + 1} of ${n}</p><h3 class="pane-title enter" style="${d(80)}">${txt(st.name)}</h3>` +
        `${st.text ? `<p class="pane-text no-visual enter" style="${d(160)}">${txt(st.text)}</p>` : ""}` +
        `${st.now ? `<div class="now enter" style="${d(260)}"><p class="kicker">${esc(s.nowLabel ?? "What we have now")}</p><p class="now-value">${txt(st.now)}</p>${st.note ? `<p class="now-note">${txt(st.note)}</p>` : ""}</div>` : ""}</div>`,
      ).join("");
      const track = s.steps.map((st, k) =>
        `<li><button type="button" class="step-btn" data-state="${k ? "next" : "now"}" aria-label="Step ${k + 1}: ${esc(plain(st.name))}"><span class="step-head"><span class="step-num">${k + 1}</span><span class="step-name">${txt(st.name)}</span></span><span class="step-bar"><span class="step-fill"></span></span></button></li>`,
      ).join("");
      return light(i, s,
        `${header(i, s, true)}<div class="mt-gap enter" style="${d(240)}"><div class="card stepper"><div class="stepper-grid"><div class="stage">${scenes}</div><div class="panes">${panes}</div></div>` +
        `<ol class="step-track" style="--n:${n}">${track}</ol></div></div>`,
        { lavender: true, motif: "bokeh" });
    },

    cards(s, i) {
      if (s.variant === "areas") {
        const items = s.items.map((it, k) => {
          const color = it.color ?? BRAND.navy;
          const sub = (it.items ?? []).map((p) =>
            `<li>${icon(p.icon, "area-item-svg", 1.75)}<p class="area-item-name">${txt(p.name)}</p>${p.summary ? `<p class="area-item-text no-visual">${txt(p.summary)}</p>` : ""}${p.detail ? `<p class="area-item-detail only-technical">${txt(p.detail)}</p>` : ""}</li>`,
          ).join("");
          return `<li class="enter" style="${stagger(k)}"><article class="card area" style="--ink:${color};--tint:${it.tint ?? hexA(color, 0.1)}"><span class="area-icon" aria-hidden="true">${icon(it.icon, "area-svg", 1.75)}</span><h3 class="area-name">${txt(it.name)}</h3>${sub ? `<ul class="area-items">${sub}</ul>` : ""}</article></li>`;
        }).join("");
        return light(i, s, `${header(i, s)}<ul class="areas mt-gap">${items}</ul>`, { motif: "contours" });
      }
      const items = s.items.map((it, k) => {
        const delay = (k % 3) * 90; // cards in a row start a beat apart
        return `<li class="card svc hoverable enter" style="--c:${it.color ?? BRAND.purple};${d(delay)}"><span class="svc-stripe" aria-hidden="true"></span>` +
          `<span class="svc-icon" style="--base:${delay}ms" aria-hidden="true">${serviceIcon(it)}</span><h3 class="svc-name">${txt(it.name)}</h3>` +
          `${it.summary ? `<p class="svc-summary no-visual">${txt(it.summary)}</p>` : ""}${it.tag ? `<span class="tag no-visual">${txt(it.tag)}</span>` : ""}</li>`;
      }).join("");
      return light(i, s, `${header(i, s)}<ul class="services mt-gap">${items}</ul>`, { motif: "assembly" });
    },

    feature(s, i) {
      const analogy = s.analogy ? `<p class="analogy no-visual enter" style="${d(160)}"><span class="kicker">${esc(s.analogyLabel ?? "In simple terms")}</span><span class="analogy-text">${txt(s.analogy)}</span></p>` : "";
      const items = s.items.map((it, k) => {
        const specs = (it.specs ?? []).map((sp, j) => {
          const ic = sp.icon ?? specIcon(sp);
          return `<div class="spec" style="--c:${SPEC_COLORS[j % 3]}"><dt>${txt(sp.label)}</dt><dd>${ic ? icon(ic, "spec-icon") : ""}<span class="spec-line"><span class="spec-value">${count(sp.value)}</span><span class="spec-unit">${esc(sp.unit ?? "")}</span></span></dd></div>`;
        }).join("");
        return `<article class="machine enter" style="${stagger(k)}"><div class="machine-photo">${it.image ? `<img src="${esc(it.image)}" alt="${esc(plain(it.name))} photo" loading="lazy">` : icon(it.icon ?? "server", "ph-svg", 1.25)}</div>` +
          `<div class="machine-body">${it.kicker ? `<p class="kicker">${txt(it.kicker)}</p>` : ""}<h3 class="machine-name">${txt(it.name)}</h3>` +
          `${it.description ? `<p class="machine-desc no-visual">${txt(it.description)}</p>` : ""}${specs ? `<dl class="specs">${specs}</dl>` : ""}</div></article>`;
      }).join("");
      return light(i, s, `${eyebrow(i, s.eyebrow)}${heading(s.title)}${analogy}<div class="machines mt-gap">${items}</div>`, { motif: "circuit" });
    },

    photos(s, i) {
      const items = s.items.map((p, k) =>
        `<li class="photo enter" style="${stagger(k)}">${p.image ? `<img src="${esc(p.image)}" alt="${esc(plain(p.name))}" loading="lazy" class="ken">` : `<span class="photo-ph">${icon("camera", "ph-svg", 1.25)}</span>`}<div class="photo-cap"><p>${txt(p.name)}</p></div></li>`,
      ).join("");
      return light(i, s, `${header(i, s)}<ul class="photos mt-gap">${items}</ul>`, { motif: "network" });
    },

    projects(s, i) {
      const [lead, ...rest] = s.items;
      const timeline = (steps) => {
        const reached = steps.reduce((last, st, k) => (st.state === "next" ? last : k), 0);
        const fill = steps.length > 1 ? reached / (steps.length - 1) : 0;
        const inset = `${50 / steps.length}%`;
        return `<div class="timeline"><div class="tl-track" style="left:${inset};right:${inset}" aria-hidden="true"><div class="tl-fill grow-x" style="width:${fill * 100}%;${d(400)}"></div></div>` +
          `<ol class="tl-steps" style="--n:${steps.length}">${steps.map((st, k) =>
            `<li class="enter" style="${d(400 + k * 110)}"><span class="tl-dot" data-state="${st.state}" aria-hidden="true">${icon(st.icon ?? stepIcon(plain(st.label)), "tl-icon")}</span>` +
            `<span class="tl-text"><span class="tl-label">${txt(st.label)}</span><span class="no-visual">${txt(st.note ?? "")}</span><span class="sr-only">${st.state === "done" ? " (done)" : st.state === "now" ? " (in progress)" : " (coming next)"}</span></span></li>`,
          ).join("")}</ol></div>`;
      };
      const photo = (p) => {
        const r = p.range;
        const focus = p.imageFocus ? ` style="object-position:${esc(p.imageFocus)};transform-origin:${esc(p.imageFocus)}"` : "";
        return `<div class="lead-photo">${p.image ? `<img src="${esc(p.image)}" alt="${esc(p.imageTitle ?? p.commonName ?? plain(p.title))}" class="ken"${focus}>` : ""}<div class="lead-photo-shade" aria-hidden="true"></div>` +
          `<div class="lead-photo-top">${p.conservation || p.facts?.length ? `<ul class="chips">${p.conservation ? `<li class="redlist"><span>${esc(p.conservation.code)}</span>${esc(p.conservation.label)}</li>` : ""}${(p.facts ?? []).map((f) => `<li class="chip">${txt(f)}</li>`).join("")}</ul>` : ""}` +
          `${r ? `<div><p class="kicker-mint">${esc(r.title)}</p><ul class="places">${(r.current ?? []).map((x) => `<li>${esc(x)}</li>`).join("")}${(r.former ?? []).map((x) => `<li class="former"><span class="sr-only">Formerly </span>${esc(x)}</li>`).join("")}</ul>${r.former?.length ? `<p class="places-note">${esc(r.formerNote ?? "Struck through: islands where it no longer survives in the wild")}</p>` : ""}</div>` : ""}</div>` +
          `${p.imageTitle || p.imageCredit ? `<div class="lead-photo-cap">${p.imageTitle ? `<p class="cap-title">${esc(p.imageTitle)}</p>` : ""}${p.imageCredit ? `<p class="cap-credit">${esc(p.imageCredit)}</p>` : ""}</div>` : ""}</div>`;
      };
      let html = header(i, s, true);
      if (lead) {
        const p = lead;
        const panel = p.image || p.conservation || p.range || p.facts?.length;
        const highlights = (p.highlights ?? []).map((h, k) => `<div class="hl" style="--c:${HIGHLIGHT_COLORS[k % 4]}"><dt>${txt(h.label)}</dt><dd><span class="hl-value">${count(h.value)}</span>${h.unit ? `<span class="hl-unit">${esc(h.unit)}</span>` : ""}</dd></div>`).join("");
        const c = p.citation;
        const citation = c ? `<div class="citation">${qrSvg(c.url, "cite-qr", `QR code linking to ${plain(c.text)}`)}<p class="cite-text"><a href="${esc(c.url)}" target="_blank" rel="noopener noreferrer">${txt(c.text)}${icon("external-link", "icon-sm")}</a><span class="cite-url no-visual">${esc(c.url.replace(/^https?:\/\//, ""))}</span>${c.note ? `<span class="no-visual">${txt(c.note)}</span>` : ""}</p></div>` : "";
        const partners = p.partners?.length ? `<div class="partners no-visual"><span class="kicker-muted">In partnership with</span>${p.partners.map((x) => `<span class="partner">${esc(x)}</span>`).join("")}</div>` : "";
        html += `<article class="card lead enter mt-gap" style="${d(220)}"><span class="lead-stripe" aria-hidden="true"></span>${panel ? photo(p) : ""}<div class="lead-body"><div>` +
          `${p.status ? `<span class="status-pill">${txt(p.status)}</span>` : ""}<h3 class="lead-title">${txt(p.title)}</h3>` +
          `${p.species ? `<p class="species">${esc(p.species)}${p.commonName ? `<span class="common"> · ${esc(p.commonName)}</span>` : ""}</p>` : ""}` +
          `${p.summary ? `<p class="lead-summary no-visual">${txt(p.summary)}</p>` : ""}${highlights ? `<dl class="highlights">${highlights}</dl>` : ""}</div>` +
          `<div class="lead-side">${p.steps?.length ? `<div class="timeline-block"><p class="kicker-muted">${esc(p.stepsTitle ?? "From sample to result")}</p>${timeline(p.steps)}${p.next ? `<p class="next no-visual"><strong>What’s next: </strong>${txt(p.next)}</p>` : ""}</div>` : ""}` +
          `${partners || citation ? `<div class="lead-foot">${partners}${citation}</div>` : ""}</div></div></article>`;
      }
      if (rest.length) {
        html += `<ul class="projects-rest">${rest.map((p, k) =>
          `<li class="card proj enter" style="${stagger(k, 320)}">${p.status ? `<p class="kicker">${txt(p.status)}</p>` : ""}<h3 class="proj-title">${txt(p.title)}</h3>${p.species ? `<p class="proj-species">${esc(p.species)}</p>` : ""}${p.summary ? `<p class="proj-summary no-visual">${txt(p.summary)}</p>` : ""}</li>`,
        ).join("")}</ul>`;
      }
      return light(i, s, html, { motif: "contours" });
    },

    stats(s, i) {
      const tiles = (s.tiles ?? []).map((t, k) =>
        `<div class="card tile enter${k ? " no-visual" : ""}" style="--c:${t.color ?? TILE_COLORS[k % 4]};${stagger(k)}"><span class="tile-stripe" aria-hidden="true"></span><dt>${txt(t.label)}</dt><dd>${count(t.value)}</dd></div>`,
      ).join("");
      const ch = s.chart;
      const chart = ch ? `<figure class="card chart-card enter" style="${d(260)}"><figcaption><span class="chart-title">${txt(ch.title)}</span>${ch.range ? `<span class="chart-range">${esc(ch.range)}</span>` : ""}</figcaption><div class="chart-body">${barChart(ch)}</div>${ch.note ? `<p class="chart-note">${txt(ch.note)}</p>` : ""}</figure>` : "";
      return light(i, s, `${header(i, s)}<div class="stats-grid">${tiles ? `<dl class="tiles">${tiles}</dl>` : ""}${chart}</div>`, { lavender: true, motif: "radar" });
    },

    team(s, i) {
      const items = s.members.map((m, k) =>
        `<li class="card member enter" style="${stagger(k)}"><div class="member-photo">${m.image ? `<img src="${esc(m.image)}" alt="${esc(m.fullName ?? m.nickname)}" loading="lazy" class="ken">` : `<span class="member-ph">${icon("user-round", "ph-svg", 1.25)}</span>`}</div>` +
        `<div class="member-text"><p class="member-nick">${esc(m.nickname)}</p>${m.fullName ? `<p class="member-full no-visual">${esc(m.fullName)}</p>` : ""}${m.position ? `<p class="member-role no-visual">${txt(m.position)}</p>` : ""}</div></li>`,
      ).join("");
      return light(i, s, `${header(i, s, true)}<ul class="team mt-gap">${items}</ul>`, { motif: "bokeh" });
    },

    videos(s, i) {
      const media = (v) => {
        if (v.youtubeId) return `<button type="button" class="yt" data-yt="${esc(v.youtubeId)}" aria-label="Play ${esc(plain(v.title))}"><img src="https://i.ytimg.com/vi/${encodeURIComponent(v.youtubeId)}/hqdefault.jpg" alt="" loading="lazy"><span class="yt-play">${icon("play")}</span></button>`;
        if (v.src) return `<video src="${esc(v.src)}" controls preload="none"${v.poster ? ` poster="${esc(v.poster)}"` : ""}></video>`;
        return `<span class="video-ph">${icon("play", "ph-svg", 1.25)}<span>Add a youtubeId or src in DECK</span></span>`;
      };
      const items = s.items.map((v, k) =>
        `<li class="card video enter" style="${stagger(k)}"><div class="video-frame">${media(v)}</div><p class="video-meta"><span class="video-title">${txt(v.title)}</span>${v.duration ? `<span class="video-dur">${esc(v.duration)}</span>` : ""}</p></li>`,
      ).join("");
      return light(i, s, `${header(i, s)}<ul class="videos mt-gap">${items}</ul>`, {});
    },

    contact(s, i) {
      const qrs = s.qrCodes ?? [];
      const social = s.social
        ? `<div class="social"><p class="social-handle">Follow us: <strong>${esc(s.social.handle)}</strong></p>${s.social.platforms?.length ? `<ul class="social-list" aria-label="Find us on">${s.social.platforms.map((p) => {
            const path = SOCIAL[socialKey(p)];
            return `<li title="${esc(p)}">${path ? `<svg viewBox="0 0 24 24" class="social-svg" aria-hidden="true"><path d="${path}"/></svg><span class="sr-only">${esc(p)}</span>` : `<span class="social-text">${esc(p)}</span>`}</li>`;
          }).join("")}</ul>` : ""}</div>`
        : "";
      const emails = (s.emails ?? []).map((e, k) => `<li class="enter" style="${stagger(k, 250)}"><a href="mailto:${esc(e.address)}" class="email"><span class="email-label">${txt(e.label)}</span><span class="email-address">${esc(e.address)}</span></a></li>`).join("");
      const plates = qrs.map((q, k) =>
        `<li class="enter" style="${stagger(k, 400)}"><a href="${esc(q.url)}" target="_blank" rel="noopener noreferrer" class="qr"><span class="qr-plate"><span class="qr-well">${qrSvg(q.url, "qr-svg", `QR code for ${plain(q.label)}`)}</span></span><span class="qr-org">${esc(DECK.lab?.qrLabel ?? "")}</span><span class="qr-label">${txt(q.label)}</span></a></li>`,
      ).join("");
      const title = qrs.length ? `<span class="for-words">${txt(s.title)}</span><span class="for-visual">${esc(s.scanTitle ?? "Scan to connect")}</span>` : txt(s.title);
      return `<div class="slide contact"><span class="backdrop" aria-hidden="true">${aurora(CONTACT_BLOBS)}${sequence()}</span>${helixArt("contact-helix")}` +
        `<div class="contact-inner"><div><p class="eyebrow on-dark"><span class="ebar" aria-hidden="true"></span>${pad(i)}${s.eyebrow ? `<span class="elabel"> · ${txt(s.eyebrow)}</span>` : ""}</p>` +
        `<h2 class="title contact-title enter" style="${d(80)}">${title}</h2>${s.intro ? `<p class="contact-intro no-visual">${txt(s.intro)}</p>` : ""}${social}</div>` +
        `${emails ? `<ul class="emails${qrs.length ? " for-words" : ""}">${emails}</ul>` : ""}${plates ? `<ul class="qrs">${plates}</ul>` : ""}</div></div>`;
    },
  };

  // ---- Build the page ------------------------------------------------------------------
  const slides = DECK.slides.filter((s) => RENDER[s.type]);
  document.title = DECK.title ?? document.title;
  main.innerHTML = slides.map((s, i) =>
    `<section id="${esc(s.id ?? `slide-${i}`)}" aria-label="${esc(navLabel(s))}" data-type="${s.type}"${LIGHT_TYPES.has(s.type) ? ' data-tone="light"' : ""} data-reveal="${i === 0 ? "visible" : "pending"}">${RENDER[s.type](s, i)}</section>`,

  const sections = [...main.children];

  const lab = DECK.lab ?? {};
  for (const id of ["header-logo", "footer-logo"]) document.getElementById(id).setAttribute("aria-label", lab.logoAlt ?? "Logo");
  document.getElementById("brand-name").innerHTML = (lab.headerLines ?? []).map(esc).join("<br>");
  document.getElementById("footer-name").textContent = lab.footerName ?? "";
  document.getElementById("footer-line").textContent = lab.footerLine ?? "";
  document.getElementById("footer-note").textContent = lab.footerNote ?? "";
  for (const svg of document.querySelectorAll("svg[data-icon]")) {
    svg.outerHTML = icon(svg.dataset.icon, svg.getAttribute("class"));
  }

  // ---- State -----------------------------------------------------------------------------
  const MUSIC_KEY = "pgcv-tour-music";
  const state = {
    audience: AUDIENCES.includes(DECK.audience) ? DECK.audience : "general",
    presenting: false,
    current: 0,
    /** The step reached on a slide with steps; any other slide is at its first. */
    step: { index: 0, step: 0 },
    autoAdvance: false,
    music: (() => { try { return localStorage.getItem(MUSIC_KEY) === "on"; } catch { return false; } })(),
  };

  // ---- Audience toggles --------------------------------------------------------------------
  const toggles = [document.getElementById("aud-header"), document.getElementById("aud-dark")];
  for (const group of toggles) {
    group.innerHTML = AUDIENCES.map((a) => `<button type="button" role="radio" data-audience="${a}">${a === "visual" && group.id === "aud-header" ? icon("image", "icon-sm") : ""}${AUDIENCE_LABELS[a]}</button>`).join("");
    group.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-audience]");
      if (btn) chooseAudience(btn.dataset.audience);
    });
  }
  function renderAudience() {
    root.dataset.audience = state.audience;

    state.autoAdvance = a === "visual";
    renderAudience();
    update();
  }

  // ---- Reveal on scroll and count-ups ---------------------------------------------------------
  /** The sticky header hides the bottom of the slide above, so anything only under it counts as off screen. */
  const HEADER_PX = 80;
  function parseCount(value) {
    const m = String(value).match(/^(\D*?)(\d[\d,]*(?:\.\d+)?)([^]*)$/);
    if (!m) return null;
    const [, prefix, digits, suffix] = m;
    const target = Number(digits.replace(/,/g, ""));
    return Number.isFinite(target) ? { prefix, target, decimals: digits.split(".")[1]?.length ?? 0, grouped: digits.includes(","), suffix } : null;
  }
  function formatCount(p, n) {
    const number = p.grouped ? n.toLocaleString("en-PH", { minimumFractionDigits: p.decimals, maximumFractionDigits: p.decimals }) : n.toFixed(p.decimals);
    return `${p.prefix}${number}${p.suffix}`;
  }
  function runCounts(section) {
    for (const el of section.querySelectorAll(".count")) {
      const final = el.dataset.final;
      const out = el.firstElementChild;
      const parsed = parseCount(final);
      cancelAnimationFrame(el._frame);
      if (!parsed || reducedMotion()) { out.textContent = final; continue; }
      out.textContent = formatCount(parsed, 0);
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / 1100);
        out.textContent = t < 1 ? formatCount(parsed, parsed.target * (1 - (1 - t) ** 3)) : final;
        if (t < 1) el._frame = requestAnimationFrame(tick);
      };
      el._frame = requestAnimationFrame(tick);
    }
  }
  function setReveal(section, value) {
    if (section.dataset.reveal === value) return;
    section.dataset.reveal = value;
    if (value === "visible") runCounts(section);
  }
  /**
   * Plays a slide's entrances whenever it scrolls into view, and rewinds them
   * once it has left the screen: "reset" drops the animations, then two frames
   * later "pending" holds them on their first frame for the next visit.
   */
  for (const section of sections) {
    let frame = 0;
    new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting)) {

    new IntersectionObserver((entries) => {
      const last = entries.at(-1);
      if (last && !last.isIntersecting && section.dataset.reveal === "visible") {

        frame = requestAnimationFrame(() => { frame = requestAnimationFrame(() => setReveal(section, "pending")); });
      }
    }, { rootMargin: `-${HEADER_PX}px 0px 0px 0px` }).observe(section);
    // Looping backgrounds pause while their slide is off screen.
    new IntersectionObserver((entries) => {
      const last = entries.at(-1);
      if (last) section.toggleAttribute("data-offscreen", !last.isIntersecting);
    }).observe(section);
  }

  // Track which slide is on screen, so the keys continue from wherever the visitor scrolled to.
  const currentObserver = new IntersectionObserver((entries) => {
    for (const e of entries) {
      if (!e.isIntersecting) continue;
      const index = sections.indexOf(e.target);
      if (index >= 0 && index !== state.current) {

        update();
      }
    }
  }, { rootMargin: "-45% 0px -50% 0px" });
  sections.forEach((s) => currentObserver.observe(s));

  // ---- Stepper slides --------------------------------------------------------------------------
  /** Restarts the CSS animations inside an element, so an entrance plays again. */
  const replay = (el) => el.getAnimations?.({ subtree: true }).forEach((a) => { a.cancel(); a.play(); });
  const steppers = new Map();
  slides.forEach((slide, index) => {
    if (slide.type !== "stepper") return;
    const section = sections[index];
    const panes = [...section.querySelectorAll(".pane")];
    const scenes = [...section.querySelectorAll(".stage-scene")];
    const buttons = [...section.querySelectorAll(".step-btn")];
    const n = panes.length;
    const ms = slide.stepMs ?? 5000;
    let auto = { scene: 0, held: false };
    let wasActive = false;
    let shown = 0;
    let signature = "";
    let timer = 0;
    /** The step the presenter has reached with the keys, or null when the steps play on a timer. */
    const stepped = () => (state.presenting && !state.autoAdvance ? (state.step.index === index ? state.step.step : 0) : null);
    function sync() {
      const active = state.current === index;
      if (active && !wasActive) auto = { scene: 0, held: false }; // each visit plays from the first step
      wasActive = active;
      const st = stepped();
      const scene = st === null ? auto.scene : Math.max(0, Math.min(n - 1, st));
      const playing = st === null && active && !auto.held && !reducedMotion();
      const sig = `${scene}|${playing}|${active}`;
      if (sig === signature) return;
      signature = sig;
      if (scene !== shown) {
        panes[shown].classList.add("is-off");
        scenes[shown].hidden = true;
        panes[scene].classList.remove("is-off");
        scenes[scene].hidden = false;
        replay(panes[scene]);
        shown = scene;
      }
      buttons.forEach((b, k) => {
        b.dataset.state = k < scene ? "done" : k === scene ? "now" : "next";
        if (k === scene) b.setAttribute("aria-current", "step");
        else b.removeAttribute("aria-current");
        const fill = b.querySelector(".step-fill");
        fill.classList.remove("filling");
        if (k === scene && playing) {
          fill.style.setProperty("--t", `${ms}ms`);
          void fill.offsetWidth; // restart the fill
          fill.classList.add("filling");
        }
      });
      clearTimeout(timer);
      if (playing) {
        timer = setTimeout(() => {
          auto.scene = (auto.scene + 1) % n;
          sync();
        }, ms);
      }
    }
    buttons.forEach((b, k) => b.addEventListener("click", () => {
      if (stepped() === null) {
        auto = { scene: k, held: true };
        sync();
      } else {
        setStep(index, k);
      }
    }));
    steppers.set(index, { n, ms, sync });
  });
  function setStep(index, step) {
    state.step = { index, step };
    steppers.get(index)?.sync();
  }

  // ---- Navigation ---------------------------------------------------------------------------------
  function goTo(index, step = 0) {
    const i = Math.max(0, Math.min(sections.length - 1, index));
    state.current = i;
    state.step = { index: i, step };
    sections[i].scrollIntoView({ behavior: reducedMotion() ? "auto" : "smooth", block: "start" });
    update();
  }
  document.getElementById("home-link").addEventListener("click", (e) => {
    e.preventDefault();
    goTo(0);
  });

  // ---- Present mode --------------------------------------------------------------------------------
  const controls = document.getElementById("controls");
  const autoBtn = document.getElementById("auto-btn");
  const musicBtn = document.getElementById("music-btn");
  const countdown = document.getElementById("countdown");
  const progress = document.getElementById("progress");

  /** Progress: a short double helix with one rung per slide; each rung jumps to its slide. */
  const rungs = [];
  (function buildProgress() {
    const STEP = 22, PAD = 10, MID = 15, AMP = 9, WAVE = STEP * 4;
    const width = PAD * 2 + STEP * (sections.length - 1);
    const strand = (sign) => {
      let p = "";
      for (let x = 0; x <= width; x += 2) p += `${x ? "L" : "M"}${x} ${(MID + sign * AMP * Math.sin(((x - PAD) / WAVE) * 2 * Math.PI)).toFixed(2)}`;
      return p;
    };
    const lines = sections.map((_, i) => {
      const x = PAD + i * STEP;
      // Rungs at a crossover would vanish; keep a minimum so every slide shows.
      const half = Math.max(3, Math.abs(AMP * Math.sin(((x - PAD) / WAVE) * 2 * Math.PI)) - 2);
      return `<line x1="${x}" x2="${x}" y1="${MID - half}" y2="${MID + half}"/>`;
    }).join("");
    progress.style.width = `${width}px`;
    progress.innerHTML = `<svg viewBox="0 0 ${width} 30" width="${width}" height="30" fill="none" stroke-linecap="round" aria-hidden="true"><defs><linearGradient id="progress-strand" gradientUnits="userSpaceOnUse" x1="0" x2="${width}" y1="0" y2="0"><stop offset="0" stop-color="${LOGO.orange}"/><stop offset="0.5" stop-color="${LOGO.magenta}"/><stop offset="1" stop-color="#2f9ae8"/></linearGradient></defs><path d="${strand(-1)}" stroke="#fff" stroke-opacity="0.25" stroke-width="1.5"/><path d="${strand(1)}" stroke="url(#progress-strand)" stroke-width="2"/>${lines}</svg>` +
      slides.map((s, i) => `<button type="button" aria-label="Go to ${esc(navLabel(s))}" style="left:${PAD + i * STEP - STEP / 2}px;width:${STEP}px" data-go="${i}"></button>`).join("");
    rungs.push(...progress.querySelectorAll("line"));
    progress.addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-go]");
      if (btn) goTo(Number(btn.dataset.go));
    });
  })();

  /** Slide fit: each slide is scaled (CSS zoom) to the largest size that fits above the controls. */
  const MIN_ZOOM = 0.6, MAX_ZOOM = 1.5, CONTROLS_PX = 64;
  const slideEls = () => sections.map((s) => s.firstElementChild);
  const inFlow = (slide) => [...slide.children].filter((c) => !["absolute", "fixed"].includes(getComputedStyle(c).position));
  const contentHeight = (slide) => inFlow(slide).reduce((sum, c) => sum + c.getBoundingClientRect().height, 0);
  function largestFittingZoom(fits) {
    if (fits(MAX_ZOOM)) return MAX_ZOOM;
    // Binary search: a wider layout can reflow into fewer rows, so height isn't proportional to zoom.
    let lo = Math.round(MIN_ZOOM * 100), hi = Math.round(MAX_ZOOM * 100);
    while (hi - lo > 1) {
      const mid = Math.floor((lo + hi) / 2);
      if (fits(mid / 100)) lo = mid;
      else hi = mid;
    }
    return lo / 100;
  }
  function fitSlide(slide, available) {
    const zoom = largestFittingZoom((z) => {
      slide.style.zoom = z === 1 ? "" : String(z);
      return contentHeight(slide) <= available;
    });

  }

    };
    const observer = new ResizeObserver(fitAll);

    window.addEventListener("resize", fitAll);
    fitAll();
    return () => {
      cancelAnimationFrame(frame);
      observer.disconnect();
      window.removeEventListener("resize", fitAll);

  let stopFit = null;
  function startPresenting() {
    state.presenting = true;
    // Visual is for a screen nobody presents from, so it plays by itself.
    state.autoAdvance = state.audience === "visual";
    root.setAttribute("data-presenting", "");
    document.documentElement.setAttribute("data-presenting", "");
    controls.hidden = false;
    document.documentElement.requestFullscreen?.().catch(() => {
      // Fullscreen refused (an iframe, iOS): the presentation layout still applies.
    });

    requestAnimationFrame(() => sections[state.current].scrollIntoView({ block: "start" }));

  }
  function stopPresenting() {
    state.presenting = false;
    state.autoAdvance = false;

    document.documentElement.removeAttribute("data-presenting");

    stopFit = null;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});

    update();
  }

  document.getElementById("exit-btn").addEventListener("click", stopPresenting);
  document.addEventListener("fullscreenchange", () => {
    if (!document.fullscreenElement && state.presenting) stopPresenting();
  });
  autoBtn.addEventListener("click", () => {
    state.autoAdvance = !state.autoAdvance;
    update();
  });

  /** The last step of a slide; auto-advance plays steps on their own, so then the keys move whole slides. */
  const lastStep = (index) => (state.autoAdvance ? 0 : (steppers.get(index)?.n ?? 1) - 1);
  window.addEventListener("keydown", (e) => {
    if (!state.presenting) return;
    if (e.target instanceof HTMLElement && e.target.closest("input, textarea, iframe, video")) return;
    const step = state.step.index === state.current ? state.step.step : 0;
    if (["ArrowRight", "ArrowDown", "PageDown", " "].includes(e.key)) {
      e.preventDefault();
      if (step < lastStep(state.current)) setStep(state.current, step + 1);
      else goTo(state.current + 1);
    } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
      e.preventDefault();
      // Going back lands on the previous slide's last step, as if it had just been played.
      if (step > 0 && !state.autoAdvance) setStep(state.current, step - 1);
      else goTo(state.current - 1, lastStep(state.current - 1));
    } else if (e.key === "Home") {
      e.preventDefault();
      goTo(0);
    } else if (e.key === "End") {
      e.preventDefault();
      goTo(sections.length - 1);
    } else if (e.key === "Escape") {
      stopPresenting();
    }
  });

  /** How long auto-advance stays on a slide: stepper slides stay for all their steps. */
  function slideMs(index) {
    const s = slides[index];
    if (s.durationMs) return s.durationMs;
    const st = steppers.get(index);
    return st ? st.n * st.ms : DECK.autoAdvanceMs ?? 20000;
  }
  let advanceTimer = 0;
  let countdownKey = "";
  function armAutoAdvance() {
    clearTimeout(advanceTimer);
    const on = state.presenting && state.autoAdvance;
    const key = on ? `${state.current}` : "";
    if (key !== countdownKey) {
      countdownKey = key;
      countdown.hidden = !on;
      if (on) {
        // Restart the countdown line for this slide.
        countdown.style.setProperty("--t", `${slideMs(state.current)}ms`);
        countdown.style.animation = "none";
        void countdown.offsetWidth;
        countdown.style.animation = "";

    if (!on) return;
    const arm = () => {
      advanceTimer = setTimeout(() => {

  }
  if (DECK.music) {
    musicBtn.hidden = false;
    musicBtn.addEventListener("click", () => {
      state.music = !state.music;
      try { localStorage.setItem(MUSIC_KEY, state.music ? "on" : "off"); } catch { /* storage blocked: lasts this visit */ }
      update();
    });
  }
  function updateMusic() {
    if (!DECK.music) return;
    const playing = state.presenting && state.music;
    // Quieter under the Videos slide.
    const ducked = slides[state.current]?.type === "videos";
    if (playing) {
      if (!audio.src) audio.src = DECK.music;
      if (audio.paused) {
        audio.volume = 0;
        audio.play().catch(() => { /* blocked or missing file: carry on in silence */ });
      }
      fadeTo(ducked ? MUSIC_DUCKED : MUSIC_VOLUME, 1200);
    } else if (!audio.paused) {
      fadeTo(0, 800, () => audio.pause());
    }
  }

  // ---- Videos: a thumbnail that loads the player on click ------------------------------------------
  main.addEventListener("click", (e) => {
    const btn = e.target.closest(".yt");
    if (!btn) return;
    const id = btn.dataset.yt;
    // YouTube won't play embeds on a page opened straight from a file, so open it there instead.
    if (location.protocol === "file:") {
      window.open(`https://www.youtube.com/watch?v=${encodeURIComponent(id)}`, "_blank", "noopener");
      return;
    }
    const frame = document.createElement("iframe");
    frame.src = `https://www.youtube-nocookie.com/embed/${encodeURIComponent(id)}?rel=0&autoplay=1`;
    frame.title = btn.getAttribute("aria-label") ?? "Video";
    frame.allow = "accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen";
    frame.referrerPolicy = "strict-origin-when-cross-origin";
    btn.replaceWith(frame);
    frame.focus();
  });

  // ---- Keep everything in step -----------------------------------------------------------------------
  function update() {
    rungs.forEach((line, i) => {
      const reached = i <= state.current;
      line.style.stroke = reached ? BRAND.teal : "#fff";
      line.style.strokeOpacity = reached ? "1" : "0.3";
      line.style.strokeWidth = i === state.current ? "4" : "2.5";
    });
    progress.querySelectorAll("button").forEach((b, i) => {
      if (i === state.current) b.setAttribute("aria-current", "step");
      else b.removeAttribute("aria-current");
    });
    autoBtn.setAttribute("aria-pressed", String(state.autoAdvance));
    autoBtn.innerHTML = `${icon(state.autoAdvance ? "pause" : "play", "icon-sm")}Auto-advance`;
    if (DECK.music) {
      musicBtn.setAttribute("aria-pressed", String(state.music));
      musicBtn.title = state.music ? "Turn the background music off" : "Play background music";
      musicBtn.innerHTML = `${icon(state.music ? "music" : "volume-x", "icon-sm")}Music`;
    }
    steppers.forEach((s) => s.sync());
    armAutoAdvance();
    updateMusic();
  }

  renderAudience();
  update();
});
</script>

name: CI

on:
  push:
    branches: [main, database-integration]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Lint + Typecheck + Build + Test
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: dummy-key-for-ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24 ships npm 11. npm 10 (bundled with Node 20 and 22) rejects the
      # lockfile over the optional peer @emnapi/runtime, and Node 24 also meets
      # the >=22 engine requirement of @supabase/supabase-js.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Test
        run: npm test --if-present
